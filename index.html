<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ROMI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1c2130;
    --border: #252b38;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #6aa9ff;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #facc15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 13px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .kpi .sub-v { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .filters label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .filters select, .filters input {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  .filters input { min-width: 220px; }
  .chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
          padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .chip.active { color: var(--text); border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  canvas { max-height: 280px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { position: sticky; top: 0; background: var(--panel-2); text-align: right;
             padding: 9px 10px; border-bottom: 1px solid var(--border); font-weight: 600;
             color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  thead th.left { text-align: left; }
  thead th.sorted::after { content: " ▾"; color: var(--accent); }
  thead th.sorted.asc::after { content: " ▴"; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  tbody td.left { text-align: left; }
  tbody tr:hover { background: rgba(106,169,255,0.06); }

  .pos { color: var(--green); font-weight: 600; }
  .neg { color: var(--red); font-weight: 600; }
  .zero { color: var(--muted); }

  .channel-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 620px; }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px)  { .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>ROMI Dashboard</h1>
  <div class="sub">Ефективність маркетингових каналів та кампаній</div>

  <div class="kpis" id="kpis"></div>

  <div class="filters">
    <label>Канал:</label>
    <div id="channelChips" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
    <span style="flex:1"></span>
    <input id="search" placeholder="Пошук по кампанії…" />
    <select id="sortSel">
      <option value="ROMI">Сортувати: ROMI</option>
      <option value="Spend">Spend</option>
      <option value="Installs">Installs</option>
      <option value="CPI">CPI</option>
      <option value="CPA">CPA</option>
      <option value="CR3">CR3</option>
    </select>
  </div>

  <div class="grid">
    <div class="card">
      <h3>ROMI по кампаніях</h3>
      <canvas id="romiChart"></canvas>
    </div>
    <div class="card">
      <h3>Витрати по каналах</h3>
      <canvas id="spendChart"></canvas>
    </div>
  </div>

  <div class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr id="theadRow"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const RAW = `Channel,Campaign,Spend,Impressions,CPM,clicks,CTR,CPC,Installs,CI,CPI,Activations,CT,Cancels_10th_fl,CPA,CPA_account,Purchase_1,CR1,CR2,CR3,pLTV,ROMI

Influencer,Instagram Macro,10500,840000,12.5,10080,1.20%,1.04,1814,18.00%,5.79,1360,75.00%,272,57.07,9.65,184,10.14%,13.53%,16.91%,43.6,-23.60%
Influencer,YouTube Mid-tier,7400,493000,15.01,5916,1.20%,1.25,1005,17.00%,7.36,804,80.00%,160,64.35,11.49,115,11.44%,14.30%,17.86%,46.2,-28.20%
Influencer,TikTok Micro,3800,760000,5.0,9880,1.30%,0.38,1679,17.00%,2.26,1259,75.00%,251,20.99,3.77,181,10.78%,14.38%,17.96%,40.8,94.34%`;

const CHANNEL_COLORS = {
  'Facebook': '#4267B2',
  'Google Ads': '#EA4335',
  'TikTok': '#25F4EE',
  'Apple Search Ads': '#A2AAAD',
  'Snapchat': '#FFFC00',
  'Unity Ads': '#222C37',
  'ironSource': '#7C3AED',
  'Influencer': '#F472B6',
};

// --- CSV parse ---
const lines = RAW.trim().split('\n');
const headers = lines[0].split(',');
const rows = lines.slice(1).map(line => {
  const parts = line.split(',');
  const obj = {};
  headers.forEach((h, i) => obj[h] = parts[i]);
  return obj;
});

const parsePct = v => v == null ? 0 : parseFloat(String(v).replace('%',''));
const parseNum = v => v == null ? 0 : parseFloat(v);
rows.forEach(r => {
  r._Spend = parseNum(r.Spend);
  r._Impressions = parseNum(r.Impressions);
  r._CPM = parseNum(r.CPM);
  r._clicks = parseNum(r.clicks);
  r._CTR = parsePct(r.CTR);
  r._CPC = parseNum(r.CPC);
  r._Installs = parseNum(r.Installs);
  r._CI = parsePct(r.CI);
  r._CPI = parseNum(r.CPI);
  r._Activations = parseNum(r.Activations);
  r._CT = parsePct(r.CT);
  r._CPA = parseNum(r.CPA);
  r._CR3 = parsePct(r.CR3);
  r._pLTV = parseNum(r.pLTV);
  r._ROMI = parsePct(r.ROMI);
  r._Purchase_1 = parseNum(r.Purchase_1);
});

const channels = [...new Set(rows.map(r => r.Channel))];

// --- State ---
const state = {
  channel: 'All',
  search: '',
  sortKey: '_ROMI',
  sortDir: 'desc',
};

// --- Formatters ---
const fmtMoney = n => '$' + Math.round(n).toLocaleString('en-US');
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const fmtPct = n => (n >= 0 ? '' : '') + n.toFixed(2) + '%';

// --- Filtering ---
function filtered() {
  return rows.filter(r =>
    (state.channel === 'All' || r.Channel === state.channel) &&
    (state.search === '' || r.Campaign.toLowerCase().includes(state.search.toLowerCase()) || r.Channel.toLowerCase().includes(state.search.toLowerCase()))
  );
}

// --- KPIs ---
function renderKpis() {
  const d = filtered();
  const spend = d.reduce((s, r) => s + r._Spend, 0);
  const installs = d.reduce((s, r) => s + r._Installs, 0);
  const activations = d.reduce((s, r) => s + r._Activations, 0);
  const purchases = d.reduce((s, r) => s + r._Purchase_1, 0);
  const avgCpi = installs ? spend / installs : 0;
  // weighted ROMI by spend
  const wRomi = spend ? d.reduce((s, r) => s + r._ROMI * r._Spend, 0) / spend : 0;
  const kpis = [
    { label: 'Витрати', value: fmtMoney(spend), sub: `${d.length} кампаній` },
    { label: 'Installs', value: fmtInt(installs), sub: `CPI ${avgCpi.toFixed(2)}` },
    { label: 'Активації', value: fmtInt(activations), sub: `CT ${installs ? (activations/installs*100).toFixed(1) : 0}%` },
    { label: 'Покупки', value: fmtInt(purchases), sub: `CR3 ${installs ? (purchases/installs*100).toFixed(2) : 0}%` },
    { label: 'Сер. ROMI (зв.)', value: fmtPct(wRomi), sub: 'зважений по Spend', cls: wRomi >= 0 ? 'pos' : 'neg' },
    { label: 'Кращий ROMI', value: d.length ? fmtPct(Math.max(...d.map(r=>r._ROMI))) : '—',
      sub: d.length ? d.reduce((a,b)=>a._ROMI>b._ROMI?a:b).Campaign : '' },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div>
      <div class="value ${k.cls||''}">${k.value}</div>
      <div class="sub-v">${k.sub||''}</div></div>`
  ).join('');
}

// --- Channel chips ---
function renderChips() {
  const el = document.getElementById('channelChips');
  const items = ['All', ...channels];
  el.innerHTML = items.map(c =>
    `<span class="chip ${state.channel===c?'active':''}" data-ch="${c}">${c}</span>`
  ).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => { state.channel = chip.dataset.ch; renderAll(); };
  });
}

// --- Table ---
const COLUMNS = [
  { key: 'Channel', label: 'Канал', left: true },
  { key: 'Campaign', label: 'Кампанія', left: true },
  { key: '_Spend', label: 'Spend', fmt: fmtMoney },
  { key: '_Impressions', label: 'Impr.', fmt: fmtInt },
  { key: '_clicks', label: 'Clicks', fmt: fmtInt },
  { key: '_CTR', label: 'CTR', fmt: v => v.toFixed(2) + '%' },
  { key: '_CPC', label: 'CPC', fmt: v => '$' + v.toFixed(2) },
  { key: '_Installs', label: 'Installs', fmt: fmtInt },
  { key: '_CPI', label: 'CPI', fmt: v => '$' + v.toFixed(2) },
  { key: '_CPA', label: 'CPA', fmt: v => '$' + v.toFixed(2) },
  { key: '_CR3', label: 'CR3', fmt: v => v.toFixed(2) + '%' },
  { key: '_pLTV', label: 'pLTV', fmt: v => '$' + v.toFixed(1) },
  { key: '_ROMI', label: 'ROMI', fmt: fmtPct, color: true },
];

function renderTable() {
  const thead = document.getElementById('theadRow');
  thead.innerHTML = COLUMNS.map(c => {
    const sorted = state.sortKey === c.key;
    return `<th class="${c.left?'left':''} ${sorted?'sorted':''} ${sorted && state.sortDir==='asc'?'asc':''}" data-key="${c.key}">${c.label}</th>`;
  }).join('');
  thead.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if (state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = k; state.sortDir = 'desc'; }
      renderTable();
    };
  });

  const data = filtered().slice().sort((a, b) => {
    const va = a[state.sortKey], vb = b[state.sortKey];
    if (typeof va === 'string') return state.sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return state.sortDir === 'asc' ? va - vb : vb - va;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = data.map(r => {
    return '<tr>' + COLUMNS.map(c => {
      let v = r[c.key];
      let cls = c.left ? 'left' : '';
      if (c.color) {
        cls += r._ROMI > 0 ? ' pos' : (r._ROMI < 0 ? ' neg' : ' zero');
      }
      let text = c.fmt ? c.fmt(v) : v;
      if (c.key === 'Channel') {
        const color = CHANNEL_COLORS[v] || '#888';
        text = `<span class="channel-dot" style="background:${color}"></span>${v}`;
      }
      return `<td class="${cls}">${text}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

// --- Charts ---
let romiChart, spendChart;
function renderCharts() {
  const d = filtered().slice().sort((a,b) => b._ROMI - a._ROMI);
  const labels = d.map(r => r.Campaign);
  const romiVals = d.map(r => r._ROMI);
  const bgColors = d.map(r => r._ROMI >= 0 ? 'rgba(74,222,128,0.7)' : 'rgba(248,113,113,0.7)');

  if (romiChart) romiChart.destroy();
  romiChart = new Chart(document.getElementById('romiChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: romiVals, backgroundColor: bgColors, borderRadius: 4 }] },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.parsed.x.toFixed(2)}%` } } },
      scales: {
        x: { ticks: { color: '#8b93a7', callback: v => v + '%' }, grid: { color: '#252b38' } },
        y: { ticks: { color: '#e6e9ef', font: { size: 10 } }, grid: { display: false } }
      }
    }
  });

  // Spend by channel (pie)
  const byCh = {};
  filtered().forEach(r => byCh[r.Channel] = (byCh[r.Channel]||0) + r._Spend);
  const chLabels = Object.keys(byCh);
  const chVals = chLabels.map(c => byCh[c]);
  const chColors = chLabels.map(c => CHANNEL_COLORS[c] || '#888');

  if (spendChart) spendChart.destroy();
  spendChart = new Chart(document.getElementById('spendChart'), {
    type: 'doughnut',
    data: { labels: chLabels, datasets: [{ data: chVals, backgroundColor: chColors, borderColor: '#161a22', borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#e6e9ef', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${fmtMoney(ctx.parsed)}` } }
      }
    }
  });
}

function renderAll() { renderKpis(); renderChips(); renderTable(); renderCharts(); }

// --- Events ---
document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
document.getElementById('sortSel').addEventListener('change', e => {
  state.sortKey = '_' + e.target.value; state.sortDir = 'desc'; renderTable();
});

renderAll();
</script>
</body>
</html>
